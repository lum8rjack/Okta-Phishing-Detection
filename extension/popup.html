<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Okta Phishing Detection</title>
    <style>
        * { box-sizing: border-box; }
        html {
            border-radius: 14px;
            overflow: hidden;
            background: linear-gradient(180deg, #1e3a5f 0%, #0d2137 100%);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            min-width: 280px;
            background: linear-gradient(180deg, #1e3a5f 0%, #0d2137 100%);
            color: #e8f0fe;
            text-align: center;
            border-radius: 14px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            margin: 0 0 6px 0;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
        }
        .header p {
            margin: 0;
            font-size: 13px;
            line-height: 1.4;
            color: #b8d4f0;
        }
        .actions {
            display: flex;
            justify-content: center;
        }
        #options-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 500;
            color: #0d2137;
            background: #4da3ff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.1s ease;
        }
        #options-btn:hover {
            background: #7ab8ff;
        }
        #options-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Okta Phishing Detection</h1>
        <p>Shows a warning only when a page looks like Okta but is not on okta.com.</p>
    </div>
    <div class="actions">
        <button type="button" id="options-btn">Options</button>
    </div>
</body>
<script type="text/javascript" src="popup.js"></script>
</html>
